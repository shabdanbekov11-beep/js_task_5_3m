<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <div class="wrapper">
        <div class="timer">
            <h1>До дня рождения осталось:</h1>
            <div class="timer-row">
                <div class="timer-item">
                    <h2 id="day"></h2>
                    <span>дней</span>
                </div>
                  <div class="timer-item">
                    <h2 id="hour"></h2>
                    <span>часов</span>
                </div>
                  <div class="timer-item">
                    <h2 id="minute"></h2>
                    <span>минут</span>
                </div>
                  <div class="timer-item">
                    <h2 id="second"></h2>
                    <span>секунд</span>
                </div>
            </div>
        </div>
        <div class="congrats">
            <h1 id="congrate_content">С днём рождения, Бекзат! 🎉</h1>
            <p>Желаю крепкого здоровья, крутых проектов и лёгкого кода!</p>
        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
